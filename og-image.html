<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <title>Estela OG Image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        width: 1200px;
        height: 630px;
        place-items: center;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 78% 18%, rgba(100, 244, 223, 0.2), transparent 310px),
          radial-gradient(circle at 22% 82%, rgba(140, 255, 184, 0.12), transparent 280px),
          linear-gradient(135deg, #050607, #081312 64%, #050607);
        color: #f3f7f6;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      body::before {
        position: absolute;
        inset: 0;
        content: "";
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 46px 46px;
      }

      .card {
        position: relative;
        display: grid;
        width: 1080px;
        height: 510px;
        align-items: center;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 56px;
        padding: 54px 64px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        background: rgba(5, 10, 11, 0.78);
        box-shadow: 0 42px 110px rgba(0, 0, 0, 0.45);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        font-size: 30px;
        font-weight: 800;
      }

      .mark {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border: 1px solid rgba(100, 244, 223, 0.48);
        border-radius: 50%;
        background: rgba(100, 244, 223, 0.12);
        color: #64f4df;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #8cffb8;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 590px;
        margin: 0;
        font-size: 68px;
        line-height: 0.98;
        letter-spacing: 0;
      }

      p {
        max-width: 600px;
        margin: 20px 0 0;
        color: #a7b5b2;
        font-size: 25px;
        font-weight: 500;
        line-height: 1.45;
      }

      .visual {
        position: relative;
        height: 370px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        background:
          linear-gradient(145deg, rgba(100, 244, 223, 0.12), transparent 36%),
          rgba(8, 13, 15, 0.92);
      }

      .visual::before {
        position: absolute;
        inset: 0;
        content: "";
        background-image:
          linear-gradient(rgba(100, 244, 223, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(100, 244, 223, 0.1) 1px, transparent 1px);
        background-size: 42px 42px;
        transform: perspective(680px) rotateX(58deg) translateY(74px) scale(1.45);
        transform-origin: bottom center;
      }

      svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      path {
        fill: none;
        stroke-width: 2;
      }

      .cyan {
        stroke: rgba(100, 244, 223, 0.36);
      }

      .green {
        stroke: rgba(140, 255, 184, 0.26);
      }

      .amber {
        stroke: rgba(245, 197, 107, 0.28);
      }

      .node {
        stroke: rgba(5, 10, 11, 0.72);
        stroke-width: 3;
      }

      .panel {
        position: absolute;
        left: 42px;
        top: 62px;
        width: 260px;
        padding: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(5, 10, 11, 0.82);
        font-size: 18px;
        font-weight: 800;
      }

      .panel.two {
        right: 34px;
        top: 190px;
        left: auto;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section>
        <div class="brand">
          <span class="mark">E</span>
          <span>Estela</span>
        </div>
        <p class="eyebrow">Marketplace growth · Global operations</p>
        <h1>Amazon & E-Commerce Growth Experts</h1>
      </section>
      <section class="visual" aria-hidden="true">
        <svg viewBox="0 0 500 370">
          <path class="cyan" d="M 425 255 C 386 334, 244 344, 142 292 C 40 240, 50 112, 170 82 C 298 50, 484 141, 425 255 Z"></path>
          <path class="green" d="M 454 296 C 422 354, 312 356, 224 310 C 136 264, 124 166, 202 126 C 280 86, 428 134, 454 296 Z"></path>
          <path class="amber" d="M 368 104 C 418 172, 370 278, 260 286 C 150 294, 90 198, 140 124 C 190 50, 318 36, 368 104 Z"></path>
          <circle class="node" cx="124" cy="222" r="8" fill="#64f4df"></circle>
          <circle class="node" cx="352" cy="114" r="8" fill="#8cffb8"></circle>
          <circle class="node" cx="204" cy="286" r="8" fill="#f5c56b"></circle>
        </svg>
        <div class="panel">Visibility + Conversion</div>
        <div class="panel two">PPC · SEO · Expansion</div>
      </section>
    </main>
  </body>
</html>
